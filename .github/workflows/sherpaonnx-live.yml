name: SherpaOnnx Live Tests

on:
  # Manual trigger only — these tests download ~250 MB of models per
  # platform and would burn CI minutes if run on every push.
  workflow_dispatch:
  # Run on PRs that touch SherpaOnnx code or this workflow itself so
  # regressions surface during development.
  pull_request:
    paths:
      - "src/sherpaonnx_engine.rs"
      - "src/sherpa_g2p.rs"
      - "src/sherpa_lang.rs"
      - "src/sherpa_lexicon.rs"
      - "tests/sherpaonnx_live.rs"
      - ".github/workflows/sherpaonnx-live.yml"
      - "scripts/get-model-url.py"

jobs:
  sherpa-live:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run on all three platforms to catch platform-specific ONNX runtime
        # issues. Linux is the fastest; macOS/Windows catch ARM differences
        # and COM/threading edge cases.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev wget bzip2 tar

      - name: Cache SherpaOnnx models
        # Key on the registry revision so any registry update (which
        # could rename or remove a model id) busts the cache and
        # re-downloads. Without this the workflow re-pulled ~250 MB per
        # platform on every PR that touched sherpaonnx_engine.rs.
        uses: actions/cache@v4
        with:
          path: |
            ~/.rust-tts-wrapper/sherpaonnx/piper-en_US-amy-low
            ~/.rust-tts-wrapper/sherpaonnx/icefall-en-ljspeech
            ~/.rust-tts-wrapper/sherpaonnx/kokoro-zh_en-int8
            ~/.rust-tts-wrapper/sherpaonnx/supertonic-3-multilingual
            ~/.rust-tts-wrapper/sherpaonnx/zipvoice-zh_en-emilia-distill-int8
            ~/.rust-tts-wrapper/sherpaonnx/kyutai-en-pocket-tts-int8
            ~/.rust-tts-wrapper/sherpaonnx/piper-de_DE-thorsten-medium
            ~/.rust-tts-wrapper/sherpaonnx/hifigan_v2.onnx
            ~/.rust-tts-wrapper/sherpaonnx/vocos_24khz.onnx
            ~/.voicegarden/lexicons/eng-US
            ~/.voicegarden/lexicons/de
            ~/.voicegarden/lexicons/deu
            ~/.voicegarden/lexicons/expanded.json
            ~/.voicegarden/lexicons/lexicons.json
          key: sherpa-models-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sherpa-models-${{ matrix.os }}-

      - name: Fetch registry models.json (canonical repo)
        shell: bash
        run: |
          mkdir -p /tmp/rtw-registry
          curl -sSL -o /tmp/rtw-registry/models.json \
            https://raw.githubusercontent.com/AACTools/sherpa-onnx-tts-models/main/models.json
          echo "RTW_MODELS=/tmp/rtw-registry/models.json" >> $GITHUB_ENV

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set model directory and Python helper
        shell: bash
        run: |
          # SherpaOnnx loads from $HOME/.rust-tts-wrapper/sherpaonnx/<model_id>/
          echo "MODEL_DIR=$HOME/.rust-tts-wrapper/sherpaonnx" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/scripts" >> $GITHUB_PATH

      - name: Download VITS test model (piper-en_US-amy-low)
        # English piper: espeak left sherpa-onnx 2.x, so this voice
        # speaks via the auto-generated lexicon from the voicegarden
        # eng-US bundle (downloaded in the next step).
        shell: bash
        run: |
          set -e
          mkdir -p "$MODEL_DIR"
          cd "$MODEL_DIR"
          if [ -d "piper-en_US-amy-low" ] && [ -n "$(ls -A piper-en_US-amy-low 2>/dev/null)" ]; then
            echo "piper-en_US-amy-low already present, skipping download"
            exit 0
          fi
          URL=$(get-model-url.py piper-en_US-amy-low)
          echo "Downloading $URL"
          curl -fsSL -o piper.tar.bz2 "$URL"
          mkdir -p piper-en_US-amy-low
          tar -xjf piper.tar.bz2 -C piper-en_US-amy-low --strip-components=1
          rm piper.tar.bz2
          ls -la piper-en_US-amy-low/

      - name: Download voicegarden eng-US lexicon assets
        # gruut lexicon + P2P convention pairs — the engine
        # auto-generates lexicon.txt for espeak-orphaned English models
        # (piper, matcha-en, kokoro-en, kitten) from these (#66/#67).
        shell: bash
        run: |
          set -e
          DEST="$HOME/.voicegarden/lexicons/eng-US"
          if [ -f "$DEST/lexicon.txt" ] && [ -f "$DEST/p2p-espeak.tsv" ]; then
            echo "voicegarden eng-US assets already present"
            exit 0
          fi
          mkdir -p "$DEST"
          curl -fsSL -o eng-US.tar.gz \
            https://github.com/AACTools/voicegarden-lexicons/releases/latest/download/eng-US.tar.gz
          tar -xzf eng-US.tar.gz -C "$DEST"
          rm eng-US.tar.gz
          ls -la "$DEST"

      - name: Download Matcha test model (icefall-en-ljspeech)
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "icefall-en-ljspeech" ] && [ -n "$(ls -A icefall-en-ljspeech 2>/dev/null)" ]; then
            echo "icefall-en-ljspeech already present"
            exit 0
          fi
          URL=$(get-model-url.py icefall-en-ljspeech)
          echo "Downloading $URL"
          curl -fsSL -o matcha.tar.bz2 "$URL"
          mkdir -p icefall-en-ljspeech
          tar -xjf matcha.tar.bz2 -C icefall-en-ljspeech --strip-components=1
          rm matcha.tar.bz2

      - name: Download shared Matcha vocoder (hifigan_v2.onnx)
        # Matcha acoustic models don't bundle a vocoder — they need one in
        # the base model dir (build_matcha_config falls back to it). The
        # vocoder lives in the separate `vocoder-models` release.
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -f "hifigan_v2.onnx" ]; then
            echo "hifigan_v2.onnx already present"
            exit 0
          fi
          echo "Downloading hifigan_v2.onnx"
          curl -fsSL -o hifigan_v2.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/hifigan_v2.onnx
          ls -la hifigan_v2.onnx

      - name: Download Kokoro test model (kokoro-zh_en-int8)
        # Kokoro is large (~140 MB); only fetch on Linux to keep matrix minutes
        # in check. macOS/Windows still cover VITS + Matcha.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "kokoro-zh_en-int8" ] && [ -n "$(ls -A kokoro-zh_en-int8 2>/dev/null)" ]; then
            echo "kokoro already present"
            exit 0
          fi
          URL=$(get-model-url.py kokoro-zh_en-int8)
          echo "Downloading $URL"
          curl -fsSL -o kokoro.tar.bz2 "$URL"
          mkdir -p kokoro-zh_en-int8
          tar -xjf kokoro.tar.bz2 -C kokoro-zh_en-int8 --strip-components=1
          rm kokoro.tar.bz2

      - name: Download Supertonic test model (supertonic-3-multilingual)
        # Supertonic 3 (~123 MB, 31 languages). Linux-only like Kokoro to
        # keep matrix minutes down; the unit tests cover config building on
        # every platform, this just validates end-to-end synthesis.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "supertonic-3-multilingual" ] && [ -n "$(ls -A supertonic-3-multilingual 2>/dev/null)" ]; then
            echo "supertonic already present"
            exit 0
          fi
          URL=$(get-model-url.py supertonic-3-multilingual)
          echo "Downloading $URL"
          curl -fsSL -o supertonic.tar.bz2 "$URL"
          mkdir -p supertonic-3-multilingual
          tar -xjf supertonic.tar.bz2 -C supertonic-3-multilingual --strip-components=1
          rm supertonic.tar.bz2
          ls -la supertonic-3-multilingual/

      - name: Download vocos vocoder (vocos_24khz.onnx)
        # Zipvoice needs the vocos vocoder in the base model dir; it is not
        # bundled with the model (same shared-vocoder pattern as Matcha).
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -f "vocos_24khz.onnx" ]; then
            echo "vocos_24khz.onnx already present"
            exit 0
          fi
          echo "Downloading vocos_24khz.onnx"
          curl -fsSL -o vocos_24khz.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos_24khz.onnx
          ls -la vocos_24khz.onnx

      - name: Download Zipvoice test model (zipvoice-zh_en-emilia-distill-int8)
        # Zero-shot zh+en cloning (~104 MB). Linux-only like Supertonic.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "zipvoice-zh_en-emilia-distill-int8" ] && [ -n "$(ls -A zipvoice-zh_en-emilia-distill-int8 2>/dev/null)" ]; then
            echo "zipvoice already present"
            exit 0
          fi
          URL=$(get-model-url.py zipvoice-zh_en-emilia-distill-int8)
          echo "Downloading $URL"
          curl -fsSL -o zipvoice.tar.bz2 "$URL"
          mkdir -p zipvoice-zh_en-emilia-distill-int8
          tar -xjf zipvoice.tar.bz2 -C zipvoice-zh_en-emilia-distill-int8 --strip-components=1
          rm zipvoice.tar.bz2
          ls -la zipvoice-zh_en-emilia-distill-int8/ | head -5

      - name: Download Pocket test model (kyutai-en-pocket-tts-int8)
        # Zero-shot en cloning (~94 MB). Linux-only like Supertonic.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "kyutai-en-pocket-tts-int8" ] && [ -n "$(ls -A kyutai-en-pocket-tts-int8 2>/dev/null)" ]; then
            echo "pocket already present"
            exit 0
          fi
          URL=$(get-model-url.py kyutai-en-pocket-tts-int8)
          echo "Downloading $URL"
          curl -fsSL -o pocket.tar.bz2 "$URL"
          mkdir -p kyutai-en-pocket-tts-int8
          tar -xjf pocket.tar.bz2 -C kyutai-en-pocket-tts-int8 --strip-components=1
          rm pocket.tar.bz2
          ls -la kyutai-en-pocket-tts-int8/ | head -5

      - name: Download German test model + voicegarden bundles (#82)
        # thorsten + BOTH German bundles (deu = the Phase 4 default row,
        # de for the coverage tests), provisioned with the crate's own
        # cache contract: manifest + per-key dirs + .sha256 stamps whose
        # content equals the manifest sha (a placeholder stamp would make
        # provisioning re-download on every run).
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ ! -d "piper-de_DE-thorsten-medium" ] || [ -z "$(ls -A piper-de_DE-thorsten-medium 2>/dev/null)" ]; then
            URL=$(get-model-url.py piper-de_DE-thorsten-medium)
            echo "Downloading $URL"
            curl -fsSL -o thorsten.tar.bz2 "$URL"
            mkdir -p piper-de_DE-thorsten-medium
            tar -xjf thorsten.tar.bz2 -C piper-de_DE-thorsten-medium --strip-components=1
            rm thorsten.tar.bz2
          fi
          VG="$HOME/.voicegarden/lexicons"
          mkdir -p "$VG"
          BASE=https://github.com/AACTools/voicegarden-lexicons/releases/download/v0.3.1
          for m in expanded.json lexicons.json; do
            [ -f "$VG/$m" ] || curl -fsSL -o "$VG/$m" "$BASE/$m"
          done
          # shas from the v0.3.1 manifests (deterministic release
          # artifacts; also recorded in SHERPA_NONENGLISH_G2P_PLAN.md)
          provision() {
            lang="$1"; sha="$2"
            dir="$VG/$lang"
            if [ -f "$dir/.sha256" ] && [ "$(cat "$dir/.sha256")" = "$sha" ] \
               && [ -f "$dir/$lang.fst" ] && [ -f "$dir/$lang.pho" ]; then
              echo "$lang already provisioned (sha matches)"
              return
            fi
            mkdir -p "$dir"
            curl -fsSL -o "$lang.tar.gz" "$BASE/$lang.tar.gz"
            tar -xzf "$lang.tar.gz" -C "$dir"
            rm "$lang.tar.gz"
            printf '%s' "$sha" > "$dir/.sha256"
            ls -la "$dir" | head -5
          }
          # deu (expanded, the default row): 880f03da… ; de (base): add4f489…
          provision deu 880f03dafce83b74b8d90e6c4853a49eb12c3d1c73f9a8366bd397eede61b266
          provision de add4f489d3f8f9c13eb03ef983006fc8b8054cdf6d25e6e2d8af4462fda66323

      - name: Ensure sherpa-onnx prebuilt libs are complete
        # sherpa-onnx-sys caches its downloaded static libs under
        # target/sherpa-onnx-prebuilt and SKIPS the download when the
        # directory exists. A partially-restored rust-cache then fails
        # at link time ("could not find native static library
        # sherpa-onnx-c-api") on every rerun. Delete the cache when it
        # lacks the lib so the build script re-downloads.
        shell: bash
        run: |
          DIR="target/sherpa-onnx-prebuilt"
          if [ -d "$DIR" ] && [ -z "$(find "$DIR" -name 'libsherpa-onnx-c-api.a' -o -name 'sherpa-onnx-c-api.lib' 2>/dev/null | head -1)" ]; then
            echo "cached sherpa-onnx prebuilt libs incomplete — forcing re-download"
            rm -rf "$DIR"
          else
            echo "sherpa-onnx prebuilt cache OK (or absent)"
          fi

      - name: Run live SherpaOnnx tests
        shell: bash
        run: |
          cargo test --test sherpaonnx_live --no-default-features --features sherpaonnx -- --ignored --nocapture --test-threads=1

      - name: Run German G2P live + real-bundle tests (#82)
        # The wrapper-side G2P front-end: engine → provisioning →
        # phoneme_codepoints → real audio, plus the Phase 2 converter's
        # real-coverage pins and the Phase 4 pre-synthesis assertions.
        shell: bash
        run: |
          VG="$HOME/.voicegarden/lexicons"
          TH="$MODEL_DIR/piper-de_DE-thorsten-medium"
          export SHERPA_DE_MODEL_DIR="$TH"
          export SHERPA_DE_BUNDLE_DIR="$VG/deu"
          export SHERPA_DE_MANIFEST="$VG/expanded.json"
          export SHERPA_TEST_THORSTEN_TOKENS="$TH/tokens.txt"
          export SHERPA_TEST_DE_DIR="$VG/de"
          export SHERPA_TEST_DE_LEXICON="$VG/de/lexicon.txt"
          export SHERPA_TEST_DEU_LEXICON="$VG/deu/lexicon.txt"
          cargo test --test sherpaonnx_live --no-default-features --features sherpaonnx,sherpa-g2p -- --ignored --nocapture --test-threads=1 german
          cargo test --lib --no-default-features --features sherpaonnx,sherpa-g2p sherpa_g2p sherpa_lexicon -- --ignored --nocapture
