name: Lint and Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Rust Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev

    - name: Run rustfmt check
      run: cargo fmt --all -- --check

    - name: Run clippy (Linux-compatible features)
      # `sapi` and `avsynth` are platform-gated; on Linux we lint the union
      # of features that actually build here.
      run: |
        cargo clippy --no-default-features --features system,cloud,sherpaonnx --all-targets -- -D warnings

    - name: Formatting standards summary
      run: |
        echo "## Formatting Standards" >> $GITHUB_STEP_SUMMARY
        echo "- Standard: rustfmt with default settings" >> $GITHUB_STEP_SUMMARY
        echo "- Line width: 100 characters" >> $GITHUB_STEP_SUMMARY
        echo "- Indent: 4 spaces" >> $GITHUB_STEP_SUMMARY
        echo "- No trailing whitespace" >> $GITHUB_STEP_SUMMARY
        echo "- No unused imports or variables" >> $GITHUB_STEP_SUMMARY
        echo "- Use \`cargo fmt\` to format before committing" >> $GITHUB_STEP_SUMMARY

  registry-consistency:
    # The embedded src/models.json and src/registry-version.txt must
    # never drift apart — every build needs to know exactly which registry
    # version it ships. This catches "synced one file but forgot the other"
    # without needing a Rust toolchain or network.
    name: Registry version ↔ JSON consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify sha256 + entry count match
      run: |
        set -e
        actual_sha="$(sha256sum src/models.json | awk '{print $1}')"
        pinned_sha="$(grep -E '^models\.json\.sha256:' src/registry-version.txt | awk '{print $2}')"
        if [[ "$actual_sha" != "$pinned_sha" ]]; then
          echo "::error::sha256 mismatch — src/models.json was edited without updating registry-version.txt (or vice versa)."
          echo "  actual:  $actual_sha"
          echo "  pinned:  $pinned_sha"
          echo "  fix: ./scripts/sync-registry.sh  (re-sync) or edit registry-version.txt by hand if this was an intentional local edit."
          exit 1
        fi
        actual_count="$(python3 -c "import json; print(len(json.load(open('src/models.json'))))")"
        pinned_count="$(grep -E '^entries:' src/registry-version.txt | awk '{print $2}')"
        if [[ "$actual_count" != "$pinned_count" ]]; then
          echo "::error::entry count mismatch — models.json has $actual_count entries but registry-version.txt says $pinned_count."
          exit 1
        fi
        echo "OK: models.json matches registry-version.txt (sha256 $actual_sha, $actual_count entries)."
