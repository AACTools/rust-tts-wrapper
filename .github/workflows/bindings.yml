name: Bindings

# Full test matrix for the language bindings over the C ABI:
#   Rust conformance + C harness + Node + .NET + Swift, on the OSes each
#   toolchain supports. Mirrors bindings/README.md ("Running the suites").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-conformance:
    name: Rust ABI conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: system,cloud
          - os: macos-latest
            features: avsynth,cloud
          - os: windows-latest
            features: sapi,cloud
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      - name: ABI conformance suites
        run: cargo test --no-default-features --features ${{ matrix.features }} --test ffi_conformance --test ffi_lifecycle --test ffi_safety

  c-harness:
    name: C harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      - name: Build + compile header with -Wall -Wextra -Werror + run
        run: make -C bindings/c test FEATURES=${{ runner.os == 'macOS' && 'avsynth,cloud' || 'system,cloud' }}

  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      - name: Build library
        shell: bash
        run: cargo build --no-default-features --features ${{ runner.os == 'macOS' && 'avsynth,cloud' || runner.os == 'Windows' && 'sapi,cloud' || 'system,cloud' }}
      - name: npm install + test
        working-directory: bindings/nodejs
        run: |
          npm install --no-fund --no-audit
          npm test

  dotnet:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      - name: Build library (release)
        shell: bash
        run: cargo build --release --no-default-features --features ${{ runner.os == 'Windows' && 'sapi,cloud' || 'system,cloud' }}
      - name: Set TTS_WRAPPER_LIB
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            LIB=$(cygpath -w "$PWD/target/release/rust_tts_wrapper.dll")
          else
            LIB="$PWD/target/release/librust_tts_wrapper.${{ runner.os == 'macOS' && 'dylib' || 'so' }}"
          fi
          echo "TTS_WRAPPER_LIB=$LIB" >> "$GITHUB_ENV"
      - name: dotnet test
        working-directory: bindings/dotnet
        run: dotnet test tests/RustTtsWrapper.Bindings.Tests.csproj -p:SkipNativeLibCheck=true

  # GH #71: prove the released NuGet package powers a clean Avalonia
  # win-x64 publish — packaged native library, no manual DLL copy —
  # and that the published app can enumerate/preview a SAPI voice.
  dotnet-example:
    name: .NET Avalonia example (NuGet, win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Compile the local-bindings mode (unreleased-API paths)
        working-directory: examples/dotnet/avalonia-nuget
        run: dotnet build -p:UseLocalBindings=true -p:SkipNativeLibCheck=true
      - name: Publish from the released NuGet package
        working-directory: examples/dotnet/avalonia-nuget
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish
      - name: Packaged native library resolved (no manual DLL copy)
        working-directory: examples/dotnet/avalonia-nuget
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter rust_tts_wrapper.dll publish | Select-Object -First 1
          if (-not $dll) { throw "rust_tts_wrapper.dll missing from publish output" }
          Write-Host "native library at $($dll.FullName)"
      - name: Headless smoke (engine enumeration + SAPI voice discovery + preview)
        working-directory: examples/dotnet/avalonia-nuget
        run: dotnet publish/AvaloniaNuGetDemo.dll --headless --engine sapi

  swift:
    name: Swift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build library (debug)
        run: cargo build --no-default-features --features avsynth,cloud
      - name: Verify vendored header matches include/tts_wrapper.h
        run: diff include/tts_wrapper.h bindings/swift/Sources/CRustTtsWrapper/include/tts_wrapper.h
      - name: swift test
        working-directory: bindings/swift
        env:
          TTS_WRAPPER_LIB_DIR: ${{ github.workspace }}/target/debug
        run: swift test
