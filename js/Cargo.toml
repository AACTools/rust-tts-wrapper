[package]
name = "rust-tts-wrapper-js"
version = "0.1.0"
edition = "2021"
description = "rust-tts-wrapper for JavaScript: cloud TTS engines on web APIs (wasm32)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Edge Read Aloud pump: protocol-complete + mock-proven, but Microsoft closes
# browser-origin handshakes. Off the browser surface by default; enable if a
# proxy (e.g. a Worker adding the extension Origin header) ever exists.
edge = []

[dependencies]
rust-tts-wrapper = { path = "..", default-features = false }
floravox-wasm = "0.1.1"
speechmarkdown-rust = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Request", "RequestInit", "Response", "Headers",
  "WebSocket", "MessageEvent", "BinaryType", "Event", "ErrorEvent", "CloseEvent",
] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "js"] }

[profile.release]
opt-level = 3
lto = true
