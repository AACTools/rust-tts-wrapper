name: SherpaOnnx Live Tests

on:
  # Manual trigger only — these tests download ~250 MB of models per
  # platform and would burn CI minutes if run on every push.
  workflow_dispatch:
  # Run on PRs that touch SherpaOnnx code or this workflow itself so
  # regressions surface during development.
  pull_request:
    paths:
      - "src/sherpaonnx_engine.rs"
      - "tests/sherpaonnx_live.rs"
      - ".github/workflows/sherpaonnx-live.yml"
      - "scripts/get-model-url.py"

jobs:
  sherpa-live:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run on all three platforms to catch platform-specific ONNX runtime
        # issues. Linux is the fastest; macOS/Windows catch ARM differences
        # and COM/threading edge cases.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev wget bzip2 tar

      - name: Cache SherpaOnnx models
        # Key on the hash of models.json so any registry update
        # (which could rename or remove a model id) busts the cache and
        # re-downloads. Without this the workflow re-pulled ~250 MB per
        # platform on every PR that touched sherpaonnx_engine.rs.
        uses: actions/cache@v4
        with:
          path: |
            ~/.rust-tts-wrapper/sherpaonnx/piper-nl_BE-rdh-low
            ~/.rust-tts-wrapper/sherpaonnx/icefall-en-ljspeech
            ~/.rust-tts-wrapper/sherpaonnx/kokoro-zh_en-int8
            ~/.rust-tts-wrapper/sherpaonnx/supertonic-3-multilingual
            ~/.rust-tts-wrapper/sherpaonnx/hifigan_v2.onnx
          key: sherpa-models-${{ matrix.os }}-${{ hashFiles('src/models.json') }}
          restore-keys: |
            sherpa-models-${{ matrix.os }}-

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set model directory and Python helper
        shell: bash
        run: |
          # SherpaOnnx loads from $HOME/.rust-tts-wrapper/sherpaonnx/<model_id>/
          echo "MODEL_DIR=$HOME/.rust-tts-wrapper/sherpaonnx" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/scripts" >> $GITHUB_PATH

      - name: Download VITS test model (piper-nl_BE-rdh-low)
        shell: bash
        run: |
          set -e
          mkdir -p "$MODEL_DIR"
          cd "$MODEL_DIR"
          if [ -d "piper-nl_BE-rdh-low" ] && [ -n "$(ls -A piper-nl_BE-rdh-low 2>/dev/null)" ]; then
            echo "piper-nl_BE-rdh-low already present, skipping download"
            exit 0
          fi
          URL=$(get-model-url.py piper-nl_BE-rdh-low)
          echo "Downloading $URL"
          curl -fsSL -o piper.tar.bz2 "$URL"
          mkdir -p piper-nl_BE-rdh-low
          tar -xjf piper.tar.bz2 -C piper-nl_BE-rdh-low --strip-components=1
          rm piper.tar.bz2
          ls -la piper-nl_BE-rdh-low/

      - name: Download Matcha test model (icefall-en-ljspeech)
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "icefall-en-ljspeech" ] && [ -n "$(ls -A icefall-en-ljspeech 2>/dev/null)" ]; then
            echo "icefall-en-ljspeech already present"
            exit 0
          fi
          URL=$(get-model-url.py icefall-en-ljspeech)
          echo "Downloading $URL"
          curl -fsSL -o matcha.tar.bz2 "$URL"
          mkdir -p icefall-en-ljspeech
          tar -xjf matcha.tar.bz2 -C icefall-en-ljspeech --strip-components=1
          rm matcha.tar.bz2

      - name: Download shared Matcha vocoder (hifigan_v2.onnx)
        # Matcha acoustic models don't bundle a vocoder — they need one in
        # the base model dir (build_matcha_config falls back to it). The
        # vocoder lives in the separate `vocoder-models` release.
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -f "hifigan_v2.onnx" ]; then
            echo "hifigan_v2.onnx already present"
            exit 0
          fi
          echo "Downloading hifigan_v2.onnx"
          curl -fsSL -o hifigan_v2.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/hifigan_v2.onnx
          ls -la hifigan_v2.onnx

      - name: Download Kokoro test model (kokoro-zh_en-int8)
        # Kokoro is large (~140 MB); only fetch on Linux to keep matrix minutes
        # in check. macOS/Windows still cover VITS + Matcha.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "kokoro-zh_en-int8" ] && [ -n "$(ls -A kokoro-zh_en-int8 2>/dev/null)" ]; then
            echo "kokoro already present"
            exit 0
          fi
          URL=$(get-model-url.py kokoro-zh_en-int8)
          echo "Downloading $URL"
          curl -fsSL -o kokoro.tar.bz2 "$URL"
          mkdir -p kokoro-zh_en-int8
          tar -xjf kokoro.tar.bz2 -C kokoro-zh_en-int8 --strip-components=1
          rm kokoro.tar.bz2

      - name: Download Supertonic test model (supertonic-3-multilingual)
        # Supertonic 3 (~123 MB, 31 languages). Linux-only like Kokoro to
        # keep matrix minutes down; the unit tests cover config building on
        # every platform, this just validates end-to-end synthesis.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          cd "$MODEL_DIR"
          if [ -d "supertonic-3-multilingual" ] && [ -n "$(ls -A supertonic-3-multilingual 2>/dev/null)" ]; then
            echo "supertonic already present"
            exit 0
          fi
          URL=$(get-model-url.py supertonic-3-multilingual)
          echo "Downloading $URL"
          curl -fsSL -o supertonic.tar.bz2 "$URL"
          mkdir -p supertonic-3-multilingual
          tar -xjf supertonic.tar.bz2 -C supertonic-3-multilingual --strip-components=1
          rm supertonic.tar.bz2
          ls -la supertonic-3-multilingual/

      - name: Run live SherpaOnnx tests
        shell: bash
        run: |
          cargo test --test sherpaonnx_live --no-default-features --features sherpaonnx -- --ignored --nocapture --test-threads=1
