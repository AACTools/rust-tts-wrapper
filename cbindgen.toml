language = "C"
include_guard = "TTS_WRAPPER_H"
autogen_warning = "/* Auto-generated. Do not edit. */"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]
cpp_compat = true

# Whitelist the crate's actual C ABI. The qwen3-local FFI binds an
# EXTERNAL C library (qwen3-tts.cpp) and must never leak into this
# header; a whitelist (vs. excludes) also protects against future
# internal declarations appearing here. The C-harness CI job compiles
# against this header — the safety net for anything missed.
[export]
include = [
  "tts_ctx",
  "tts_voice",
  "tts_engine_info",
  "tts_create",
  "tts_destroy",
  "tts_speak",
  "tts_speak_ssml",
  "tts_speak_sync",
  "tts_stop",
  "tts_pause",
  "tts_resume",
  "tts_get_voices",
  "tts_free_voices",
  "tts_set_voice",
  "tts_set_rate",
  "tts_set_pitch",
  "tts_set_volume",
  "tts_set_on_audio",
  "tts_set_on_boundary",
  "tts_set_on_mark",
  "tts_set_on_viseme",
  "tts_set_on_start",
  "tts_set_on_end",
  "tts_set_on_error",
  "tts_get_engine_count",
  "tts_get_engines",
  "tts_free_engines",
  "tts_get_last_error",
  "tts_synth_to_bytes",
  "tts_free_bytes",
]
